      <article class="testimonial">
        <figure class="quote"><blockquote><p>I’ve learned more from you in 2 sessions than I’ve learned from other therapists in 5 years. It feels so good to finally be making progress. It helps to have a clear understanding of myself and my partner. This is change that will last.</p></blockquote><figcaption>– AP, 38 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>So Grateful</h3><blockquote><p>I am feeling so much more hopeful since our appointment than I have felt in a long time.</p><details><summary>Read more</summary><p>I am so grateful for you. You are very gifted at knowing what is needed and how to go about it. I know there are things you say or seeds you plant and it takes me a bit to catch on or be open to (like with my family), but you’ve always been on point. You are impacting my life is such a positive way. Thank you so much.</p></details></blockquote><figcaption>– JM, 38 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>I wish we’d gone in sooner.</h3><blockquote><p>For once, my husband and I were able to discuss finances without blowing up at each other. This made it easier to address other hot topics in our marriage because we learned HOW to gravitate toward constructive communication patterns despite the emotional nature of some areas. Falling into old patterns happens less often because this new way, although challenging sometimes, feels so much better and actually gets our issues resolved.</p></blockquote><figcaption>– PM, 46 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Thank you!</h3><blockquote><p>Alison, I wanted you to know how deeply grateful I am for all the ways you’ve contributed to my personal and sexual growth. Thank you for being non-shaming, valuing a holistic approach and teaching me how to re-frame things. I appreciate all your great recommendations, in fact I’m reading The Gifts of Imperfection right now. Your words of affirmation have also been timely and restorative. You are incredibly gifted in your work and I’ve given away all your cards to friends and health professionals who plan to pass your name along to others.</p></blockquote><figcaption>– BB, 30 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Lonely, unhappy, dissatisfied in my relationship</h3><blockquote><p>I began working with Alison approximately 10 months ago due to some issues I was having regarding a relationship. After 6 years with my boyfriend, I realized the entire past year I was extraordinarily unhappy, lonely, and dissatisfied. I felt if I didn’t leave the relationship then, I might never get out and would be unhappy forever. I felt very righteous in this decision, but knew I needed to learn to take responsibility for how I felt, both on my own and in the relationship.</p><details><summary>Read more</summary><p>While at first I approached therapy as an attempt to remedy how I was feeling, I realized quickly that growth is a slow and often unpredictable process. I also realized that gaining self-awareness and self-discovery would not only help me heal from what felt like a major insult to my sense of self, but also to lay the groundwork for better coping with and handling the inevitable pressures and challenges of life.</p><p>Alison encourages an approach that focuses on being “Self-led.” Basically, she coaches and helps me to, gradually over time, build a base of inner strength and resilience that helps me adapt to everyday challenges, remain grounded and steady in the face of crisis, and to improve my relationships with other people. My ability to understand and relate to other people, especially in challenging situations, is a direct result of having more compassion and empathy (including towards myself!).</p><p>I came to have a tremendous sense of compassion for the partner I separated from, and gained a lot of insight into how we both got to where we were, and how we were equally culpable. I’m slowly rebuilding the parts of myself that have been long fractured, and reconstructing the relationship I walked away from. It’s not so much a “repair” as it is the building of a new connection and understanding of ourselves and each other altogether. I’m a new person. Each day I’m becoming a better version of myself; a version that I’m learning to fall in love with.</p></details></blockquote><figcaption>– CP, 31 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Therapy with Alison has made a VAST difference!</h3><blockquote><p>Over the course of my life, I have seen 3 other couples therapists and 3 other individual therapists. Alison has been the best therapist I could possibly have asked for. She is intelligent, wise, and adept at working with complicated individual and couples issues. She is an endless resource for materials and practices that have enhanced our marriage and our growth as individuals. In the past year, she has shown boundless compassion, patience, gentle honesty, and humor.</p><details><summary>Read more</summary><p>My husband and I sought Alison a little over a year ago after giving up hope with another couples therapist. We had a hard time finding a good therapy match because we are a non-monogamous couple, so it can be difficult to find a therapist who is non-judgmental and experienced in matters of non-monogamy. Because we live two hours away from Alison, we were skeptical of the efficacy of conducting appointments via Skype. It has proven to be just as helpful as if we were in person. There was some urgency for us to find a good therapist, however, as I had a history of suicidal ideation and several suicide attempts.</p><p>A year and a half ago, I never thought I would find myself at this point. I have a long way to go, both individually and in my marriage, but I feel like I am finally progressing forward and will never again attempt suicide. Instead, I am making deliberate positive changes in my life. My husband and I can’t know for certain what the future holds for us at this point, but I no longer feel helpless and hopeless thanks to Alison’s guidance. I never imagined, after all the years of therapy I’ve experienced, a little over a year with a single therapist could make such a vast difference. I’m incredibly grateful.</p></details></blockquote><figcaption>– MM, 53 year-old female</figcaption></figure>
      </article>
      <article class="testimonial" id="exceptional-marital-therapy">
        <figure class="quote"><h3>Exceptional marital therapy</h3><blockquote><p>EXCEPTIONAL MARITAL THERAPY! I sought therapy due to challenges within my marriage including communication and infidelity. I came to Alison at a crossroad in my life and needed to find someone to listen and support me in my struggle to gain confidence and salvage my marriage.</p><details><summary>Read more</summary><p>There was something in the way that Alison described her area of expertise and my first impression was she would be approachable and nonjudgmental, two important factors for me to form a safe and secure connection…she did not disappoint. I reached out and I don’t recall a time when I was able to simply to let go, start from the beginning and let the words flow freely.</p><p>I feel lucky and privileged that over our sessions I have improved communication with my husband, developed tools to help us continue to grow and begun the journey to greater self-awareness. I have also appreciated the realism she brings to our discussions. Life is not always easy and our path often uncertain however, Alison has been able to share insights and applicable literature to help us work through the most difficult of situations. She is positive and caring, flexible and understanding, and I am thankful for all that she has to offer.</p></details></blockquote><figcaption>– JK, 50 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Married 27 years…</h3><blockquote><p>I am 55 years old and have been married to my wife for 27 years. The last ten years have been very unpleasant with a lot of arguing, no intimacy, and feeling like we are barely friends. Alison helped me think through my situation from an unbiased perspective and has provided the reassurance and support I’ve needed to leave my marriage. I’ve been to therapy three other times and Alison is hands down the best therapist I’ve ever had.</p></blockquote><figcaption>– RT, 55 year-old male</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Therapy hesitant… but SO GLAD I met Alison!</h3><blockquote><p>I was hesitant about investing in therapy, I wasn’t sure it would be worth the money. It has turned out to be invaluable! I was battling depression, struggling in my marriage, and turning 50 years old. My husband was not interested in doing therapy so I went on my own. Alison helped me build a skill set that has revamped my marriage and has lifted the depression cloud. I really couldn’t imagine that life could be this enjoyable. I’ve learned so much about myself and have stocked my toolbox for challenging times. She was even a tremendous help with parenting tips!!! I was seeing Alison weekly and now see her every 2-3 months for supportive check-ins. She’s dynamic and holistic in her approach so I envision continuing to see her for many years to come. I’ve recommended Alison to colleagues and friends. Her services should not be kept a secret!!!</p></blockquote><figcaption>– PD, 52 year-old female</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>From affair to divorce to new love…</h3><blockquote><p>My current relationship began under very difficult circumstances, and we knew we needed help. We were both married and having an affair together. I had not seen a therapist before, but my partner came across Alison and had a good feeling about her. It turns out she was right. Working with Alison has helped me realize what it means to be in a real, working relationship. She doesn’t just tell you how a relationship should be, but gives you the proper tools to help get you where you want to be. I can’t tell you how many times Alison has been available to help us through all the ups and downs. She’s an incredible listener and is so good at giving you another perspective you may not have thought of before. She’ll support and challenge you at the same time. All judgement is left aside and her only goal is to help you and your partner find a place where the two of you can flourish not just as a couple, but in your own individual life as well. I’m so thankful we found her and can safely say we would not be where we are without her.</p></blockquote><figcaption>– NS, 30 year-old male</figcaption></figure>
      </article>
      <article class="testimonial" id="alison-saved-my-life">
        <figure class="quote"><h3>Alison saved my life…</h3><blockquote><p>I was referred to Alison after my third suicide attempt. Immediately after meeting her I didn’t feel alone anymore. She doesn’t just sit there and take notes – she engages me and gives quality, real world, constructive feedback. She gives me ways to ‘exercise’ the skills we discuss between sessions so I’m continually bettering myself, not just working on things for one hour a week in her office. I have become much more reflective and introspective, so I can think about things from our sessions on a much deeper level. I understand myself and others so much better now.</p><details><summary>Read more</summary><p>My extreme and violent rages of anger have virtually stopped all together. I’m now gaining an ability to pursue and recover from romantic relationships in a healthy (non-suicidal) way. My career has completely turned around.</p><p>Alison really is an “everything” therapist. Sometimes I come to my appointments with nothing to talk about or completely scatter brained, overwhelmed, or mentally flooded – in these times Alison does a great job bringing valuable focus to our discussions. No topic is off limits, and even though it might be difficult to start talking about a tough issue, Alison makes it easy to keep talking. At the appropriate times she uses humor – and it has never felt like an uptight ‘doctor’s office’ kind of visit. In fact, I look forward to therapy each week!</p><p>Above all else, what I appreciate the most is that I can TRUST her completely. Having Alison as a confidante has not only saved my life, it’s transformed it. She is the real deal. I’m beyond grateful for her helping save my life.</p></details></blockquote><figcaption>– EA, 42 year-old male</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Alison’s so reliable &amp; I can talk about ANYTHING without being judged…</h3><blockquote><p>Therapy is no stranger to me and up until working with Alison, I had pretty much lost faith in the benefits of therapy. Alison has proven quite the opposite. My personal life was shattering before me (i.e. going through separation and divorce; challenges of balancing a new romantic partner and being a single parent) and guidance was essential.</p><details><summary>Read more</summary><p>Her approach to sessions allows one to feel human. I came to her with a full plate and not once has she made me feel like I was in the wrong. She remains objective and positive while incorporating fresh, current tools to improve my quality of life. She never makes me feel ashamed to bring up anything in session. Alison has a genuine interest in helping and has gone above and beyond, even outside of session time, to assist during crucial moments of need.</p><p>My eyes have been opened in significant ways because of Alison’s methods. The tools she provides are easy to incorporate on a daily basis and have elevated my quality of life on many levels. Thinking back just a couple of months and comparing how I approached matters back then to now fascinates me. My inner spirit is revived and life is beginning to show its positives more and more.</p><p>Without question, Alison is a 5-star therapist!</p></details></blockquote><figcaption>– SG, 35 year-old female</figcaption></figure>
      </article>
      <article class="testimonial" id="depression-anxiety-parenting">
        <figure class="quote"><h3>Depression, Anxiety, Parenting</h3><blockquote><p>I have met with several therapists over the last 18 years for my depression and anxiety, but none of them have come close to helping me progress the way Alison has. I’ve never felt better. I’m very reserved, but even from the first visit she made it really easy to open up by initiating conversation in a natural and genuinely caring way. She was able to pinpoint toxic relationships and behavioral patterns that were keeping my self-esteem very low. I feel so much better about myself and really wish that I was able to figure all of this out 20 years ago! Alison asks good questions and lets me complete my thoughts. I have learned incredibly important parenting skills and boundary setting to better the relationship with my daughter. She has helped me understand the ways in which my choices in parenting are critical to my daughter’s self-esteem and healthy development. I’m enjoying a new and improved life journey, I couldn’t be more grateful for meeting Alison!!!</p></blockquote><figcaption>– BL, 36 year-old female</figcaption></figure>
      </article>
      <article class="testimonial" id="not-hopelessly-broken">
        <figure class="quote"><h3>NOT hopelessly broken after all!</h3><blockquote><p>I have been in and out of therapy over the past 20 years for anxiety and depression. While I liked some of my other therapists, I would eventually quit after improvement stalled. I never felt I had truly gotten better or that I had been given tools and learned techniques to help myself. I began to see myself as hopelessly broken.</p><details><summary>Read more</summary><p>After experiencing a particularly scary black mood for over a month, I looked on the internet for a new therapist. I found Alison on Psychology Today and something about her resonated with me. The first appointment was very much a “get to know each other appointment” which was to be expected. She needed to learn what she was dealing with. From day one, I told her I was always going to be 100% honest and put it all out on the table every week, because I wanted to get well once and for all. On our second appointment, she already had an article for me to read that proved to me she had listened and already understood some of my main issues and was going to start giving me the tools I need to heal my pain. I have been seeing Alison for five months now, once a week. There have been a couple of times that I was panicky and she fit me in for extra sessions, so I trust her to be there when I need her.</p><p>Every week has been different, but each time I feel like we’ve deeply addressed the “next” step in my recovery. With Alison’s guidance, I am learning what my issues are, where they may have started, why I feel the way I do, the ways in which my behavior is damaging to myself and others, and how to make improvements and heal. I’m learning meditation techniques which have helped me immensely. She is teaching me how to feel safe and responsible for my own well-being which has been very empowering and is allowing me to become a more mature, secure, and better functioning adult. I am better able to cope with uncomfortable feelings without lashing out which has improved my relationships at work, with my family, and in my personal life.</p><p>Because I have been to several other therapists, I come from a place of experience in my evaluation of Alison’s quality as a therapist…She is very knowledgeable and is able to see a problem from a variety of different perspectives and offer an array of solutions. She has the common sense to tailor her therapeutic services to each individual’s needs or based on their “readiness” to address the problem in a given way. She does not just sit and listen and nod her head expecting me to figure it out on my own and collect payment. Alison contributes to the conversation, challenges me in new ways, and offers ideas when appropriate. She knows when to just sit and let me sob on her couch, which she encourages when that’s the work that needs to be done.</p><p>I feel very safe with and trust Alison which is one of the most important considerations when choosing a therapist. If you’re going to be honest, bare it all, and do the work…it can make you very vulnerable. I have never felt judged, criticized, pitied, or hopeless since being in Alison’s care. She has an admirably strong character and is a phenomenal listener. On a 5-star scale I give her a 5++!!</p></details></blockquote><figcaption>– LK, 50 year-old female</figcaption></figure>
      </article>
      <article class="testimonial" id="diminished-anxiety">
        <figure class="quote"><h3>Diminished anxiety dramatically improved my outlook on life!</h3><blockquote><p>Alison has helped me learn to be more calm and present in the moment instead of constantly looking towards the future (or dwelling on the past) and being consumed by anxiety.</p><details><summary>Read more</summary><p>She is very kind and easy to talk to and her office is warm and comforting. I especially appreciate her suggestions at the end of each session for “homework” to make therapy feel like an active task that is improving my life and outlook. As an introvert, I appreciate that Alison is very welcoming and makes me very comfortable to discuss whatever is on my mind.</p><p>I was finally able to discuss, from start to finish, my sexual abuse history and I didn’t feel shamed or judged. I appreciate that our sessions feel like constructive conversation rather than a doctor-patient visit, and it makes me feel very safe. It’s absolutely worth paying out of pocket for therapy with Alison, and this is coming from a PhD student!</p></details></blockquote><figcaption>– RB, 23 year-old female</figcaption></figure>
      </article>
      <article class="testimonial" id="abusive-significant-other">
        <figure class="quote"><h3>Mentally, emotionally, physically abusive significant other</h3><blockquote><p>Alison helped me get through a very difficult time in my life. I was living with and dating an abusive woman who has been professionally diagnosed with Borderline and Narcissistic Personality Disorders. I wanted to end that unhealthy relationship and living situation but was struggling with many irrational feelings that my partner did her best to instill and re-enforce.</p><details><summary>Read more</summary><p>Alison helped me in a huge way by providing an objective, unbiased perspective and by helping me to solidify an action plan to preserve my safety. Even though it was very difficult and uncomfortable for me to discuss my situation, Alison was sympathetic, supportive, and re-assuring which helped me feel less embarrassed and ashamed. She gave me the courage to act upon what I wanted, and guided me as to how to do it safely. Alison genuinely cares and never acts put-out or as if I am wasting her time.</p><p>That abusive significant other is now out of my life and I couldn’t have done it without Alison’s coaching. I’m much happier and very grateful that I can now focus my energy on healing and moving on. So, THANK YOU ALISON! You are awesome!</p></details></blockquote><figcaption>– AB, 46 year-old male</figcaption></figure>
      </article>
      <article class="testimonial">
        <figure class="quote"><h3>Stale sex(less) life</h3><blockquote><p>I’ve been married to my wife for 16 years. The first seven or eight years of being together was amazing sexually!!! With our connection I never thought I would be in a therapist’s office discussing sexual frustrations. For the last five years my wife has been very disinterested in sex, and the one time per month that we do engage in sexual activity it doesn’t last long (5-10 minutes) because she wants to just get it done with. I feel like an imposition on her. After some couple sessions and individual sessions with Alison we’ve enriched our sex life, have the frequency back up to 4-5 times per week, and the quality of our sex has profoundly improved. I couldn’t be happier with our results from therapy!</p></blockquote><figcaption>– WE, 44 year-old male</figcaption></figure>
      </article>
